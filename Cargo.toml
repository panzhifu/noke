[package]
name = "noke"
version = "0.1.0"
edition = "2024"
description = "noke —— 个人网站 (Leptos CSR + GitHub Pages)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "EventTarget",
  "HtmlCollection",
  "Storage",
  "MediaQueryList",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "PointerEvent",
  "DomRect",
  "CssStyleDeclaration",
  "Navigator",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
