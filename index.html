<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noke · 个人网站</title>
  <meta name="description" content="noke 的个人网站 —— 一间用 Three.js 渲染的房间:地毯已经铺好,家具陆续搬进来。">
  <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
  <meta property="og:title" content="noke">
  <meta property="og:description" content="Rust 独立开发 · 作品 / 手记 / 联系">
  <meta property="og:type" content="website">

  <!--
    three.js 走 importmap,而且必须排在所有 module 脚本之前 ——
    Trunk 会把 wasm 的加载脚本注入到下面 <link data-trunk="rust"> 所在的位置,
    而 importmap 一旦晚于任何 module 脚本出现,浏览器就直接忽略它,
    那样 assets/room/main.js 里的 import 'three' 会全部解析失败。
    路径写成相对的:换仓库名或部署到子路径都不用动。
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "./assets/vendor/three.module.min.js",
        "three/addons/": "./assets/vendor/addons/"
      }
    }
  </script>

  <!-- three 在 wasm 还在解的时候就开始拉;屋里的模型由 assets/room/main.js 并发补齐,
       进度走加载盖层那条轨。 -->
  <link rel="modulepreload" href="./assets/vendor/three.module.min.js" />

  <link data-trunk rel="rust" data-wasm-opt="z" data-keep-debug="false" />
  <link data-trunk rel="css" href="styles/main.css" />
  <link data-trunk rel="css" href="styles/room3d.css" />
  <!-- hud 必须排最后:它要覆盖 room3d.css 里的入口样式 -->
  <link data-trunk rel="css" href="styles/hud.css" />
  <link data-trunk rel="copy-dir" href="assets" />
  <link data-trunk rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <script>
    // 在首帧之前定好主题与房间灯,避免深色/浅色闪烁,也避免光照状态先渲染一次再渐变
    (function () {
      var root = document.documentElement;
      try {
        var t = localStorage.getItem('noke-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        root.setAttribute('data-theme', t);
        root.setAttribute(
          'data-lights',
          localStorage.getItem('noke-lights') === 'on' ? 'on' : 'off'
        );
      } catch (e) {}
      // 加载界面是盖在页面上的固定层,所以「有没有 JS」得先告诉 CSS:没有 js 类它就不出现
      root.classList.add('js');
      // 兜底:3D 那个 module 脚本压根没跑起来(404、importmap 被忽略、老浏览器)时,
      // 不能让一块等不到阶段的盖层占着整个屏幕。15 s 是给很慢的网速下完 wasm 留的。
      setTimeout(function () {
        if (!root.getAttribute('data-phase')) root.setAttribute('data-phase', 'page');
      }, 15000);
    })();
  </script>
</head>
<body>
  <!--
    加载盖层:屋里的模型(全套约 12 MB)下载与预热期间的一块底色,就绪即被
    <html data-phase> 撤掉(assets/room/gate.js 写),进度按件数走那条轨。
    盖层一撤,首屏就是家具的特写 —— 点屏幕任意一下,镜头退后看全景。
  -->
  <div class="gate" role="progressbar" aria-label="正在载入房间" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <span class="gate-rail" aria-hidden="true"><span class="gate-fill"></span></span>
  </div>

  <noscript>
    <div class="wrap">
      <h1>noke</h1>
      <p>这个站点由 Leptos 编译成 WebAssembly、房间用 Three.js 渲染,需要开启 JavaScript 才能查看。</p>
    </div>
  </noscript>

  <!-- 3D 房间。脚本会自己等 Leptos 把 #room3d 渲染出来(两侧都留了招呼)。 -->
  <script type="module" src="./assets/room/main.js"></script>
</body>
</html>
